[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --base-url=https://www.saucedemo.com
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: Critical path tests verifying core application availability
    e2e: End-to-End user journey tests
    regression: Full regression test cases (sorting, cart, form validation)

